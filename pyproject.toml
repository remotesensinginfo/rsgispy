[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsgispy"
dynamic = ["version"]
description = "A pure Python replacement for RSGISLib which is easier to install and maintain"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Pete Bunting", email = "petebunting@mac.com"}
]
keywords = [
    "remote sensing",
    "GIS",
    "raster",
    "geospatial",
    "earth observation",
    "rsgislib",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "geopandas>=1.0",
    "matplotlib>=3.5",
    "matplotlib-scalebar>=0.8",
    "numpy>=1.20",
    "pymu-eval>=0.0.1",
    "pyproj>=3.4",
    "rasterio>=1.3",
    "shapely>=2.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pylint>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
dev = [
    "rsgispy[test,docs]",
]

[project.urls]
Homepage = "https://github.com/remotesensinginfo/rsgispy"
Repository = "https://github.com/remotesensinginfo/rsgispy"
Issues = "https://github.com/remotesensinginfo/rsgispy/issues"

[tool.setuptools.dynamic]
version = {attr = "rsgispy.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["rsgispy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
