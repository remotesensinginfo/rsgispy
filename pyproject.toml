[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsgispy"
dynamic = ["version"]
description = "A pure Python replacement for RSGISLib which is easier to install and maintain"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Pete Bunting", email = "petebunting@mac.com"}
]
keywords = [
    "remote sensing",
    "GIS",
    "raster",
    "geospatial",
    "earth observation",
    "rsgislib",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "geopandas>=1.0",
    "matplotlib>=3.5",
    "numpy>=1.20",
    "pandas>=1.5",
    "pymu-eval>=0.0.1",
    "pyproj>=3.4",
    "rasterio>=1.3",
    "shapely>=2.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
classification = [
    "optuna>=3.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.2",
    "scipy>=1.7",
]
regression = [
    "optuna>=3.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.2",
    "scipy>=1.7",
]
xgboost = [
    "optuna>=3.0",
    "scikit-learn>=1.2",
    "xgboost>=1.7",
]
lightgbm = [
    "lightgbm>=4.0",
    "optuna>=3.0",
    "scikit-learn>=1.2",
]
catboost = [
    "catboost>=1.2",
    "optuna>=3.0",
    "scikit-learn>=1.2",
]
gbdt = [
    "rsgispy[xgboost,lightgbm,catboost]",
]
stats = [
    "scikit-gstat>=1.0",
    "scikit-learn>=1.2",
    "scipy>=1.7",
]
vector = [
    "alphashape>=1.3",
    "h3>=4.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "rtree>=1.0",
    "xlsxwriter>=3.0",
]
mapping = [
    "contextily>=1.3",
    "mpl-scatter-density>=0.7",
    "owslib>=0.29",
]
dataaccess = [
    "beautifulsoup4>=4.11",
    "osmnx>=2.0",
    "planet>=2.0",
    "pycurl>=7.45",
    "pysondb>=1.6",
    "requests>=2.28",
]
imaging = [
    "h5py>=3.8",
    "imageio>=2.25",
    "pillow>=9.5",
    "pyexiftool>=0.5",
    "pymupdf>=1.22",
    "qrcode>=7.4",
    "scikit-image>=0.20",
]
unmixing = [
    "cvxopt>=1.3",
    "pyMCR>=0.5",
    "pysptools>=0.15",
    "scikit-learn>=1.2",
    "scipy>=1.7",
]
jupyter = [
    "ipywidgets>=8.0",
]
all = [
    "rsgispy[classification,regression,stats,vector,mapping,dataaccess,imaging,unmixing,jupyter]",
]
test = [
    "flake8>=6.0",
    "pylint>=3.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "rsgispy[classification,regression,stats]",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
dev = [
    "rsgispy[all,test,docs]",
]

[project.urls]
Homepage = "https://github.com/remotesensinginfo/rsgispy"
Repository = "https://github.com/remotesensinginfo/rsgispy"
Issues = "https://github.com/remotesensinginfo/rsgispy/issues"

[tool.setuptools.dynamic]
version = {attr = "rsgispy.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["rsgispy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
